name: Build Plumi Duo targeted viewport lab
on:
  push:
    branches: [research/plumi-duo-layout]
    paths:
      - "experiments/plumi-duo/PlumiDuoViewportLab.m"
      - ".github/workflows/build-plumi-viewport-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile ARM64 iOS interactive viewport lab
        run: |
          set -euxo pipefail
          mkdir -p build
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 \
            -dynamiclib -fobjc-arc -fblocks \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -install_name "@executable_path/Frameworks/PlumiDuoViewportLab.dylib" \
            -o build/PlumiDuoViewportLab.dylib experiments/plumi-duo/PlumiDuoViewportLab.m
          file build/PlumiDuoViewportLab.dylib
          xcrun otool -L build/PlumiDuoViewportLab.dylib
          shasum -a 256 build/PlumiDuoViewportLab.dylib > build/PlumiDuoViewportLab.dylib.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: plumi-targeted-viewport-lab
          path: build/PlumiDuoViewportLab.*
          retention-days: 7
